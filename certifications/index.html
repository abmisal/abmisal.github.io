<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Certifications</title>
    <!-- reuse existing stylesheets for a consistent look -->
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { padding: 1rem; }
        #thumbnails { display: flex; flex-wrap: wrap; gap: 1rem; }
        .thumb {
            cursor: pointer;
            width: 120px;
            text-align: center;
        }
        .thumb i { color: #d9534f; }
        .thumb .name { font-size: 0.75rem; word-break: break-word; }
        #certViewer { width: 100%; height: 80vh; border: 1px solid #ccc; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>My Certifications</h1>
    <div id="thumbnails"></div>

    <iframe id="certViewer"
            src="/Resume/viewer.html?file=/certifications/3d_design_printing-18.pdf#sidebar=1&disableDownload=true">
    </iframe>

    <script>
        // dynamic loader: fetch a JSON manifest if present, otherwise show a message
        async function loadList() {
            try {
                const resp = await fetch('/certifications/list.json');
                if (!resp.ok) throw new Error('no manifest');
                return await resp.json();
            } catch {
                // if manifest missing, fall back to an empty list
                console.warn('list.json not found, create it by running generate-list.ps1');
                return [];
            }
        }

        function renderFiles(files) {
            const container = document.getElementById('thumbnails');
            files.forEach(f => {
                const div = document.createElement('div');
                div.className = 'thumb';
                div.dataset.pdf = '/certifications/' + encodeURIComponent(f);

                const icon = document.createElement('i');
                icon.className = 'fa fa-file-pdf-o fa-3x';
                div.appendChild(icon);

                const label = document.createElement('div');
                label.className = 'name';
                label.textContent = f;
                div.appendChild(label);

                div.addEventListener('click', () => {
                    const pdf = div.dataset.pdf;
                    document.getElementById('certViewer').src =
                        '/Resume/viewer.html?file=' + encodeURIComponent(pdf) +
                        '#sidebar=1&disableDownload=true';
                });

                container.appendChild(div);
            });
        }

        (async () => {
            const files = await loadList();
            if (files.length === 0) {
                const note = document.createElement('p');
                note.textContent = 'No certificates found. Run generate-list.ps1 after adding PDFs.';
                document.getElementById('thumbnails').appendChild(note);
            }
            renderFiles(files);
        })();
    </script>
</body>
</html>
